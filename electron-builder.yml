appId: com.millwright.app
productName: Millwright
copyright: Copyright © 2026 Millwright Contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - assets/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!src'
  - '!tests'
  - '!docs'
  - '!*.md'
  - '!tsconfig*.json'
  - '!vite.config.ts'
  - '!.env*'

# P3: ship the Python sidecar alongside the installer / portable build.
# sw-sidecar.ts defaults its cwd to resourcesPath/sidecar (see its constructor).
extraResources:
  - from: 'sidecar'
    to: 'sidecar'
    filter:
      - '**/*'
  # P12: ship the bundled Python runtime so users don't have to install Python
  # + pywin32 themselves. `vendor/python/` is populated by `scripts/prepare-python.ps1`
  # before `electron-builder` runs (see .github/workflows/build.yml and
  # package.json's dist script). Path resolution at runtime lives in
  # src/main/python-path.ts — that's the single source of truth for "where's python".
  - from: 'vendor/python'
    to: 'python'

win:
  # P110: NSIS setup was retired (2026-08-04) — users reported the installer
  # repeatedly unusable, so releases now ship ONLY the portable single-file build.
  target:
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
  artifactName: '${productName}-Portable-${version}-${arch}.${ext}'

# NSIS installer config removed with the setup build (P110).

squirrelWindows: null

publish:
  provider: github
  owner: raylanlin
  repo: millwright
